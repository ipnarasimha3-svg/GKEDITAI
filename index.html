<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GKEDIT AI | No Key Edition</title>
  <style>
    :root {
      --bg: #070709;
      --card: #121216;
      --border: #23232a;
      --accent: #6366f1;
      --text: #f4f4f5;
      --text-dim: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 14px; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px; }
    .brand-title { font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .creator-tag { font-size: 0.75rem; color: var(--text-dim); }
    .creator-tag b { color: #818cf8; }
    .badge { font-size: 0.7rem; padding: 3px 8px; border-radius: 20px; border: 1px solid #10b981; color: #34d399; background: #064e3b22; }

    /* Apps Bar */
    .quick-apps { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .app-chip { background: var(--card); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; white-space: nowrap; cursor: pointer; color: var(--text-dim); }
    .app-chip:hover { border-color: var(--accent); color: #fff; }

    /* Modes */
    .feature-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: #141419; padding: 6px; border-radius: 14px; border: 1px solid var(--border); }
    .tab-btn { background: transparent; border: none; color: var(--text-dim); padding: 10px 4px; font-size: 0.75rem; font-weight: 600; border-radius: 8px; cursor: pointer; }
    .tab-btn.active { background: var(--border); color: #fff; }

    /* Main Console */
    .console-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    textarea, select { width: 100%; background: #000; border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 12px; font-size: 0.88rem; outline: none; }
    textarea:focus, select:focus { border-color: var(--accent); }

    .controls-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .action-row { display: flex; gap: 8px; }
    
    .btn { flex: 1; padding: 12px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: #22222a; color: #38bdf8; border: 1px solid #38bdf8; }

    /* Result Box */
    .terminal-box { background: #000; border: 1px solid var(--border); border-radius: 14px; padding: 16px; min-height: 120px; font-size: 0.88rem; line-height: 1.6; text-align: left; }
    .terminal-box img { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin-top: 8px; }
  </style>
</head>
<body>

<div class="app-container">
  
  <header>
    <div>
      <div class="brand-title">GKEDIT AI</div>
      <div class="creator-tag">Created by <b>@GKEDIT2141</b> | 100% Free No-Key Engine</div>
    </div>
    <div class="badge">● Online & Ready</div>
  </header>

  <!-- Quick App Opener -->
  <div class="quick-apps">
    <div class="app-chip" onclick="openApp('youtube')">▶ YouTube</div>
    <div class="app-chip" onclick="openApp('whatsapp')">💬 WhatsApp</div>
    <div class="app-chip" onclick="openApp('github')">🐙 GitHub</div>
    <div class="app-chip" onclick="openApp('camera')">📷 Camera</div>
  </div>

  <!-- Multi-Modal Selector -->
  <div class="feature-grid">
    <button class="tab-btn active" onclick="setMode('chat')">Chat & Analyze</button>
    <button class="tab-btn" onclick="setMode('image')">Image Studio</button>
    <button class="tab-btn" onclick="setMode('video')">Video Gen</button>
    <button class="tab-btn" onclick="setMode('audio')">Music / Songs</button>
  </div>

  <!-- User Input Form -->
  <div class="console-card">
    <textarea id="mainPrompt" rows="3" placeholder="Ask questions, generate images, write songs..."></textarea>

    <!-- Controls for Image & Video -->
    <div class="controls-row" id="mediaControls" style="display: none;">
      <div>
        <select id="aspectRatio">
          <option value="16:9">16:9 (Landscape / YouTube)</option>
          <option value="9:16">9:16 (Vertical / Shorts)</option>
          <option value="1:1">1:1 (Square / Post)</option>
        </select>
      </div>
      <div>
        <select id="durationLimit">
          <option value="5">5s Clip</option>
          <option value="10">10s Clip</option>
          <option value="30">30s Song</option>
        </select>
      </div>
    </div>

    <!-- Actions -->
    <div class="action-row">
      <button class="btn btn-primary" id="runBtn" onclick="runGKEditAI()">Execute</button>
      <button class="btn btn-secondary" onclick="startVoice()">🎙️ Speak</button>
    </div>
  </div>

  <!-- Output Terminal -->
  <div class="terminal-box" id="displayBox">
    <span style="color: var(--text-dim);">Ready. No API key needed. Type your command above.</span>
  </div>

</div>

<script>
  let currentMode = 'chat';

  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    
    const mediaRow = document.getElementById('mediaControls');
    mediaRow.style.display = (mode === 'image' || mode === 'video' || mode === 'audio') ? 'grid' : 'none';
  }

  function openApp(target) {
    if (target === 'youtube') window.location.href = "vnd.youtube://";
    else if (target === 'whatsapp') window.location.href = "whatsapp://";
    else if (target === 'github') window.open("https://github.com", "_blank");
    else if (target === 'camera') {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.capture = 'environment';
      input.click();
    }
  }

  // Voice Recognition (Speech to Text)
  function startVoice() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
      alert("Voice input is not supported in this browser. Please use Chrome.");
      return;
    }
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new Speech();
    rec.lang = 'en-US';
    rec.start();
    rec.onresult = (e) => {
      document.getElementById('mainPrompt').value = e.results[0][0].transcript;
      runGKEditAI();
    };
  }

  // Voice Response (Text to Speech)
  function speak(txt) {
    if ('speechSynthesis' in window) {
      const utter = new SpeechSynthesisUtterance(txt);
      window.speechSynthesis.speak(utter);
    }
  }

  // Main Multi-Modal Function (No Key Required)
  async function runGKEditAI() {
    const prompt = document.getElementById('mainPrompt').value.trim();
    const box = document.getElementById('displayBox');
    const btn = document.getElementById('runBtn');
    if (!prompt) return;

    btn.innerText = "Processing...";
    btn.disabled = true;
    box.innerHTML = `<span style="color: var(--text-dim);">GKEDIT AI is generating...</span>`;

    try {
      // 1. Image Studio (Aspect Ratio Supported)
      if (currentMode === 'image') {
        const ratio = document.getElementById('aspectRatio').value;
        const dims = ratio === '16:9' ? '1280x720' : (ratio === '9:16' ? '720x1280' : '1024x1024');
        const [w, h] = dims.split('x');
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${w}&height=${h}&nologo=true&seed=${Math.floor(Math.random()*999999)}`;
        box.innerHTML = `<div><b>Generated Image (${ratio}):</b><br/><img src="${imgUrl}" alt="GKEDIT AI Output" /></div>`;
      } 
      
      // 2. Video & Audio Mock Pipelines
      else if (currentMode === 'video' || currentMode === 'audio') {
        const ratio = document.getElementById('aspectRatio').value;
        const duration = document.getElementById('durationLimit').value;
        box.innerHTML = `
          <div>
            <b>[GKEDIT AI Multi-Modal Engine]</b><br/>
            - <b>Mode:</b> ${currentMode.toUpperCase()}<br/>
            - <b>Prompt:</b> "${prompt}"<br/>
            - <b>Aspect Ratio:</b> ${ratio}<br/>
            - <b>Duration:</b> ${duration}s<br/><br/>
            <i>Pipeline rendered successfully.</i>
          </div>`;
      } 
      
      // 3. Chat & Analysis (Free Pollinations Text Engine - Zero Keys)
      else {
        const systemPrompt = "You are GKEDIT AI, an intelligent multi-modal assistant and Gemini rival created by youtuber @GKEDIT2141. Give helpful, sharp answers.";
        const fullPrompt = `${systemPrompt} Question: ${prompt}`;
        
        const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(fullPrompt)}`);
        const reply = await res.text();
        
        box.innerText = reply;
        speak(reply);
      }
    } catch (err) {
      box.innerHTML = `<span style="color: #ef4444;">Error: ${err.message}</span>`;
    } finally {
      btn.innerText = "Execute";
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
